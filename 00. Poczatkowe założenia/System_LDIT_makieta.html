  .topbar .warn{font-size:11px;border:1px dashed #000;padding:2px 6px}
  .ctl{display:flex;align-items:center;gap:5px;font-size:12px}
  select,input,textarea,button{font-family:inherit;font-size:12px;border:1px solid #000;background:#fff;padding:3px 5px;border-radius:0}
  button{cursor:pointer}
  button:hover{background:#000;color:#fff}
  .spacer{flex:1}

  .shell{display:flex;min-height:calc(100vh - 42px);align-items:stretch}
  .side{width:232px;border-right:1px solid #000;flex:0 0 232px}
  .side .grp{font-size:10px;letter-spacing:.1em;padding:8px 10px 4px;border-bottom:1px solid #ccc;background:#eee}
  .side a.item{display:block;padding:7px 10px;border-bottom:1px solid #ddd;text-decoration:none}
  .side a.item:hover{background:#eee}
  .side a.item.on{background:#000;color:#fff}
  .side .nm{font-weight:600;font-size:12.5px}
  .side .ds{font-size:10.5px;color:#555;line-height:1.3}
  .side a.item.on .ds{color:#ccc}
  .main{flex:1;padding:14px 18px 60px;min-width:0}

  h1{font-size:19px;margin-bottom:2px}
  h2{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #000;padding-bottom:3px}
  h3{font-size:12.5px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
  .lead{font-size:12px;color:#444;margin-bottom:10px}
  p{margin-bottom:8px;max-width:80ch}

  table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:12px}
  th,td{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top}
  th{background:#eee;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#eee}
  td.num,th.num{text-align:right}
  tr.sum td,tr.sum th{background:#eee;font-weight:700}

  .cards{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}
  .card{border:1px solid #000;padding:8px 10px;min-width:145px;flex:1 1 145px}
  .card.clk{cursor:pointer}
  .card.clk:hover{background:#eee}
  .card .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#444}
  .card .v{font-size:20px;font-weight:700;line-height:1.2}
  .card .n{font-size:10.5px;color:#555}

  .bar{height:9px;border:1px solid #000;background:#fff}
  .bar span{display:block;height:100%;background:#000}

  .panel{border:1px solid #000;padding:10px 12px;margin:10px 0}
  .panel .ttl{font-weight:700;font-size:12px;border-bottom:1px solid #000;padding-bottom:3px;margin-bottom:6px}
  .two{display:flex;gap:12px;flex-wrap:wrap}
  .two>*{flex:1 1 320px;min-width:0}

  .tag{display:inline-block;border:1px solid #000;padding:0 4px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .tag.b{background:#000;color:#fff}
  .tag.g{background:#eee}

  .crumb{font-size:11px;margin-bottom:6px}
  .crumb button{border:none;background:none;text-decoration:underline;padding:0;font-size:11px}
  .crumb button:hover{background:none;color:#000;font-weight:700}

  dl.kv{display:grid;grid-template-columns:170px 1fr;gap:2px 10px;font-size:12px}
  dl.kv dt{color:#555}
  dl.kv dd{border-bottom:1px dotted #bbb}

  ul.plain{list-style:none;font-size:12px}
  ul.plain li{padding:3px 0;border-bottom:1px dotted #bbb}

  .note{border:1px dashed #000;padding:7px 9px;font-size:11.5px;margin:10px 0;background:#f7f7f7}
  .note b{text-transform:uppercase;font-size:10px;letter-spacing:.08em}

  .tabs{display:flex;gap:0;margin:10px 0 0;flex-wrap:wrap}
  .tabs button{border:1px solid #000;border-bottom:none;padding:4px 10px}
  .tabs button.on{background:#000;color:#fff}
  .tabbody{border:1px solid #000;padding:10px 12px}

  /* kalendarz */
  .kal{border:1px solid #000;border-bottom:none}
  .kalhd{display:flex;border-bottom:1px solid #000;background:#eee}
  .kalhd div{flex:1;padding:3px 5px;font-size:10.5px;text-transform:uppercase;border-right:1px solid #ccc}
  .kalhd div:last-child{border-right:none}
  .kalrow{display:flex;border-bottom:1px solid #000}
  .kalcell{flex:1;min-height:70px;border-right:1px solid #ccc;padding:2px 3px;min-width:0}
  .kalcell:last-child{border-right:none}
  .kalcell.out{background:#f4f4f4;color:#aaa}
  .kalcell .dnum{font-size:10px;color:#666}
  .kalev{border:1px solid #000;font-size:9.5px;padding:1px 3px;margin-bottom:2px;cursor:pointer;line-height:1.25;word-break:break-word}
  .kalev:hover{background:#000;color:#fff}
  .kalnav{display:flex;align-items:center;gap:8px;margin:6px 0}

  .right{text-align:right}
  .muted{color:#666}
  .hint{font-size:10.5px;color:#666;margin:-2px 0 8px}
  .inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
</style>
</head>

function cena(szkId, naDzien){
  const l = CENY.filter(c=>c.szk===szkId && c.od<=(naDzien||'2026-08-20')).sort((a,b)=>a.od<b.od?1:-1);
  if(l.length) return l[0].cena;
  const w = CENY.filter(c=>c.szk===szkId).sort((a,b)=>a.od<b.od?1:-1);
  return w.length? w[w.length-1].cena : 0;
}
function cenaDof(szkId, dofId){
  const d = DOF.find(x=>x.id===dofId);
  return cena(szkId, d? d.wniosek : null);
}

function go(view, opts){ S.view = view; Object.assign(S, opts||{}); render(); window.scrollTo(0,0); }

function ctxUcz(id){ return UCZ.filter(u=>u.inst===(id||S.inst)); }
function ctxTerm(id){ return TERM.filter(t=>szkol(t.szk).inst===(id||S.inst)); }
function ctxDof(id){ return DOF.filter(d=>uczest(d.ucz).inst===(id||S.inst)); }
function ctxSzk(id){ return SZK.filter(s=>s.inst===(id||S.inst)); }

function statyInst(id){
  const u = ctxUcz(id), d = ctxDof(id), t = ctxTerm(id);
  const przyz = d.filter(x=>PRZYZNANE.includes(uczest(x.ucz).status));
  const odbyte = t.filter(x=>x.status==='Odbyty');
  const kwotaW = d.reduce((a,b)=>a+b.kwota,0);
  const kwotaP = przyz.reduce((a,b)=>a+b.kwota,0);
  const i = inst(id||S.inst);
  return {
    osoby:u.length,
    leady:u.filter(x=>x.typ==='Lead').length,
    komerc:u.filter(x=>x.typ==='Komercyjny').length,
    bur:u.filter(x=>x.bur==='Tak').length,
    zakwal:u.filter(x=>PRZYZNANE.includes(x.status)).length,
    wnioski:d.length, przyzn:przyz.length,
    kwotaW, kwotaP,
    prowizja: Math.round(kwotaP * i.prowizja/100),
    szkolen:ctxSzk(id).length,
    terminy:t.length,
    zaplan:t.filter(x=>x.status==='Zaplanowany').length,
    wolne:t.filter(x=>x.status==='Wolny').length,
    odbyte:odbyte.length,
    minObsada:t.filter(x=>x.status!=='Odbyty' && x.ucz.length>0 && x.ucz.length<3).length
  };
}
function pct(a,b){ return b? Math.round(a/b*100) : 0; }

/* --- uczestnicy --- */
function vUczestnicy(){
  if(S.ucz) return kartaUczestnika(S.ucz);
  let u = ctxUcz();
  if(S.filtrTyp) u = u.filter(x=>x.typ===S.filtrTyp);
  if(S.filtrStatus) u = u.filter(x=>x.status===S.filtrStatus);
  const all = ctxUcz();
  const statusy = [...new Set(all.map(x=>x.status))];
  const d = ctxDof();
  const kwotaW = d.reduce((a,b)=>a+b.kwota,0);
  const kwotaP = d.filter(x=>PRZYZNANE.includes(uczest(x.ucz).status)).reduce((a,b)=>a+b.kwota,0);

  const wgStatus = statusy.map(st=>{
    const grupa = all.filter(x=>x.status===st);
    const dof = d.filter(x=>grupa.some(g=>g.id===x.ucz));
    return {st, n:grupa.length, kwota:dof.reduce((a,b)=>a+b.kwota,0)};
  }).sort((a,b)=>b.n-a.n);

  return `
  <h1>Uczestnicy i leady</h1>
  <div class="lead">${esc(inst(S.inst).nazwa)}. Lista obejmuje wyłącznie osoby tej instytucji.</div>

    <div class="card"><div class="k">Osób łącznie</div><div class="v">${all.length}</div><div class="n">${all.filter(x=>x.typ==='Lead').length} leadów</div></div>
    <div class="card"><div class="k">Kwota wnioskowana</div><div class="v">${kwotaW.toLocaleString('pl-PL')}</div><div class="n">zł, ${d.length} wniosków</div></div>
    <div class="card"><div class="k">Kwota przyznana</div><div class="v">${kwotaP.toLocaleString('pl-PL')}</div><div class="n">zł, ${pct(kwotaP,kwotaW)}% wnioskowanej</div></div>
    <div class="card"><div class="k">Zakwalifikowani</div><div class="v">${all.filter(x=>PRZYZNANE.includes(x.status)).length}</div><div class="n">z ${all.filter(x=>x.bur==='Tak').length} zarejestrowanych</div></div>
  </div>

  <h2>Leady według statusu</h2>
  <table>
    <tr><th>Status</th><th class="num">Osób</th><th class="num">Kwota wniosków</th><th style="width:30%">Udział</th><th></th></tr>
    ${wgStatus.map(r=>`<tr class="click" onclick="go('uczestnicy',{filtrStatus:'${r.st}',filtrTyp:''})">
      <td>${esc(r.st)}</td><td class="num">${r.n}</td><td class="num">${r.kwota?zl(r.kwota):'<span class="muted">—</span>'}</td>
      <td>${bar(pct(r.n,all.length))}</td><td class="right"><span class="tag">Filtruj</span></td></tr>`).join('')}
  </table>

  <h2>Lista osób</h2>
  <div class="inline">
    <input placeholder="Szukaj po nazwisku lub firmie" style="width:220px">
    <select onchange="go('uczestnicy',{filtrTyp:this.value})">
      <option value="">Wszystkie typy</option>
      ${['Lead','Dofinansowanie','Komercyjny'].map(t=>`<option value="${t}" ${S.filtrTyp===t?'selected':''}>${t}</option>`).join('')}
    </select>
    <select onchange="go('uczestnicy',{filtrStatus:this.value})">
      <option value="">Wszystkie statusy</option>
      ${statusy.map(t=>`<option value="${t}" ${S.filtrStatus===t?'selected':''}>${t}</option>`).join('')}
    </select>
    ${(S.filtrTyp||S.filtrStatus)?`<button onclick="go('uczestnicy',{filtrTyp:'',filtrStatus:''})">Wyczyść filtry</button>`:''}

  </div>
  <table>

      <td class="mono">${x.id}</td><td>${esc(x.imie)}</td><td>${esc(x.firma)}</td>

/* --- dofinansowania --- */
function vDofinansowania(){
  if(S.dof){
    const d = DOF.find(x=>x.id===S.dof);
    const u = uczest(d.ucz);
    const terminy = d.terminy.map(termin);
    const sumaCen = terminy.reduce((a,t)=>a+cenaDof(t.szk, d.id),0);
    const rows = terminy.map(t=>{
      const s = szkol(t.szk); const c = cenaDof(t.szk, d.id);
      const udzial = sumaCen? c/sumaCen : 0;
      return `<tr><td class="mono">${t.id}</td><td>${esc(s.nazwa)}</td><td class="mono">${t.od}</td>
        <td class="num">${zl(c)}</td><td class="num">${(udzial*100).toFixed(1)}%</td>
        <td class="num">${zl(d.kwota*udzial)}</td><td>${t.status}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="muted">Brak przypisanych terminów</td></tr>';
    const ostatni = terminy.length? terminy.map(t=>t.do).sort().slice(-1)[0] : '—';
    return `
    <div class="crumb"><button onclick="go('dofinansowania',{dof:null})">Dofinansowania</button> / ${d.id}</div>
    <h1>${d.id}</h1>
    <div class="lead">${esc(u.imie)} &nbsp;|&nbsp; ${esc(inst(u.inst).nazwa)} &nbsp;|&nbsp; ${d.urzad}</div>
    <div class="two">
      <div class="panel"><div class="ttl">Dane dofinansowania</div>
        <dl class="kv">
          <dt>Kwota przyznana</dt><dd>${zl(d.kwota)}</dd>
          <dt>Data wniosku</dt><dd class="mono">${d.wniosek}</dd>
          <dt>Okres realizacji</dt><dd>${d.od} do ${d.do}</dd>
          <dt>Urząd</dt><dd>${d.urzad}</dd>
          <dt>Liczba terminów</dt><dd>${d.terminy.length}</dd>
          <dt>Ostatni termin</dt><dd>${ostatni}</dd>
          <dt>Status rozliczenia</dt><dd>${d.rozliczenie}</dd>
        </dl>
      </div>

function kalendarz(){
  const [Y,M] = S.kalM.split('-').map(Number);
  const first = new Date(Y, M-1, 1);
  const startDow = (first.getDay()+6)%7;
  const dni = new Date(Y, M, 0).getDate();
  const nazwyM = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
  const t = ctxTerm();
  const pad = n => String(n).padStart(2,'0');

  let cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=dni;d++) cells.push(d);
  while(cells.length%7) cells.push(null);

  let rows='';
  for(let w=0; w<cells.length/7; w++){
    rows += '<div class="kalrow">';
    for(let k=0;k<7;k++){
      const d = cells[w*7+k];
      if(d===null){ rows += '<div class="kalcell out"></div>'; continue; }
      const iso = `${Y}-${pad(M)}-${pad(d)}`;
      const ev = t.filter(x=>x.od<=iso && x.do>=iso);
      rows += `<div class="kalcell"><div class="dnum">${d}</div>${
        ev.map(x=>`<div class="kalev" onclick="go('terminy',{term:'${x.id}'})">${esc(szkol(x.szk).nazwa)}<br>${x.ucz.length} os., ${esc(x.miejsce.split(',')[0])}</div>`).join('')
      }</div>`;
    }
    rows += '</div>';
  }
  const prev = M===1? `${Y-1}-12` : `${Y}-${pad(M-1)}`;
  const next = M===12? `${Y+1}-01` : `${Y}-${pad(M+1)}`;
  return `
  <div class="kalnav">
    <button onclick="setTab('kalM','${prev}')">Poprzedni</button>
    <strong>${nazwyM[M-1]} ${Y}</strong>
    <button onclick="setTab('kalM','${next}')">Następny</button>
    <span class="muted">kliknij wydarzenie, aby otworzyć termin</span>
  </div>
  <div class="kal">
    <div class="kalhd"><div>pon</div><div>wt</div><div>śr</div><div>czw</div><div>pt</div><div>sob</div><div>nd</div></div>
    ${rows}
  </div>`;
}

    ${INST.map(i=>{const s=statyInst(i.id);return `<tr><td>${esc(i.nazwa)}</td><td class="num">${s.osoby}</td>
      <td class="num">${s.bur}</td><td class="num">${s.zakwal}</td><td class="num">${pct(s.zakwal,s.osoby)}%</td></tr>`}).join('')}
  </table>`;
}

function statSzkolenia(){
  const wg = SZK.map(s=>{
    const t = TERM.filter(x=>x.szk===s.id);
    const osoby = t.reduce((a,b)=>a+b.ucz.length,0);
    return {s, terminy:t.length, osoby, odbyte:t.filter(x=>x.status==='Odbyty').length};
  }).filter(x=>x.osoby>0).sort((a,b)=>b.osoby-a.osoby);
  const max = Math.max(...wg.map(x=>x.osoby),1);
  return `
  <h3>Szkolenia według liczby uczestników</h3>
  <table>
    <tr><th>Szkolenie</th><th>Instytucja</th><th class="num">Terminy</th><th class="num">Osób</th><th class="num">Odbyte</th><th style="width:28%">Udział</th></tr>
    ${wg.map(x=>`<tr><td>${esc(x.s.nazwa)}</td><td>${esc(inst(x.s.inst).nazwa)}</td>
      <td class="num">${x.terminy}</td><td class="num">${x.osoby}</td><td class="num">${x.odbyte}</td>
      <td>${bar(x.osoby/max*100)}</td></tr>`).join('')}
  </table>`;
}

function statFinanse(){
  const {g,sum} = globalne();
  const msc = {};
  DOF.forEach(d=>{ const k=d.wniosek.slice(0,7); msc[k]=(msc[k]||0)+d.kwota; });
  const klucze = Object.keys(msc).sort();
  const maxM = Math.max(...Object.values(msc),1);
  return `
  <h3>Marżowość w podziale na instytucje</h3>
  <table>
    <tr><th>Instytucja</th><th class="num">Kwota przyznana</th><th class="num">Stawka</th><th class="num">Prowizja</th><th class="num">Udział w prowizji</th><th style="width:22%">Udział</th></tr>
    ${g.slice().sort((a,b)=>b.prowizja-a.prowizja).map(x=>`<tr>
      <td>${esc(x.inst.nazwa)}</td><td class="num">${zl(x.kwotaP)}</td><td class="num">${x.inst.prowizja}%</td>
      <td class="num">${zl(x.prowizja)}</td><td class="num">${pct(x.prowizja,sum('prowizja'))}%</td>
      <td>${bar(pct(x.prowizja,Math.max(...g.map(y=>y.prowizja),1)))}</td></tr>`).join('')}
    <tr class="sum"><td>Razem</td><td class="num">${zl(sum('kwotaP'))}</td><td class="num">—</td><td class="num">${zl(sum('prowizja'))}</td><td class="num">100%</td><td></td></tr>
  </table>

  <h3>Wnioskowane kwoty według miesiąca złożenia</h3>
  <table>
    <tr><th>Miesiąc</th><th class="num">Kwota</th><th style="width:40%">Udział</th></tr>
    ${klucze.map(k=>`<tr><td class="mono">${k}</td><td class="num">${zl(msc[k])}</td><td>${bar(msc[k]/maxM*100)}</td></tr>`).join('')}
  </table>
  <div class="inline"><button onclick="alert('Makieta: eksport danych finansowych')">Eksportuj do Excela</button></div>`;
}

}

/* --- rozliczenia --- */
function vRozliczenia(){
  const d = ctxDof();
  const i = inst(S.inst);
  const wiersze = [];
  d.forEach(x=>{
    const u = uczest(x.ucz);
    const terminy = x.terminy.map(termin);
    const sumaCen = terminy.reduce((a,t)=>a+cenaDof(t.szk,x.id),0);
    if(!terminy.length){ wiersze.push({dof:x, u, szk:null, kwota:x.kwota, prow:x.kwota*i.prowizja/100, msc:'bez terminu', data:''}); return; }
    terminy.forEach(t=>{
      const c = cenaDof(t.szk,x.id);
      const kwota = sumaCen? x.kwota*c/sumaCen : 0;
      wiersze.push({dof:x, u, szk:szkol(t.szk), term:t, kwota, prow:kwota*i.prowizja/100, msc:t.do.slice(0,7), data:t.do});
    });
  });

  const grup = {};
  wiersze.forEach(w=>{
    const k = S.rozlGrup==='szkolenia'? (w.szk? w.szk.nazwa : 'Bez przypisanego terminu')
            : S.rozlGrup==='uczestnicy'? w.u.imie
            : w.msc;
    (grup[k]=grup[k]||[]).push(w);
  });

  const sumK = wiersze.reduce((a,b)=>a+b.kwota,0);
  const sumP = wiersze.reduce((a,b)=>a+b.prow,0);

  let body = Object.keys(grup).sort().map(k=>{
    const g = grup[k];
    const kw = g.reduce((a,b)=>a+b.kwota,0);
    const pr = g.reduce((a,b)=>a+b.prow,0);
    return `<tr class="sum"><td colspan="2">${esc(k)}</td><td class="num">${g.length}</td><td class="num">${zl(kw)}</td><td class="num">${zl(pr)}</td><td></td></tr>
    ${g.map(w=>`<tr>
      <td class="mono">${w.dof.id}</td>
      <td>${S.rozlGrup==='uczestnicy'? (w.szk?esc(w.szk.nazwa):'<span class="muted">brak terminu</span>') : esc(w.u.imie)}</td>
      <td class="mono">${w.term? w.term.id : '—'}</td>
      <td class="num">${zl(w.kwota)}</td><td class="num">${zl(w.prow)}</td>
      <td>${w.dof.rozliczenie}</td></tr>`).join('')}`;
  }).join('');

  return `
  <h1>Rozliczenia i prowizje</h1>
  <div class="lead">${esc(i.nazwa)}, stawka ${i.prowizja}%. Rozliczenie następuje jednorazowo, po ostatnim terminie w ramach dofinansowania.</div>

  <div class="inline">
    <span>Grupuj według:</span>
    <button class="${S.rozlGrup==='szkolenia'?'':''}" onclick="setTab('rozlGrup','szkolenia')" ${S.rozlGrup==='szkolenia'?'style="background:#000;color:#fff"':''}>Szkolenia</button>
    <button onclick="setTab('rozlGrup','uczestnicy')" ${S.rozlGrup==='uczestnicy'?'style="background:#000;color:#fff"':''}>Uczestnicy</button>
    <button onclick="setTab('rozlGrup','miesiace')" ${S.rozlGrup==='miesiace'?'style="background:#000;color:#fff"':''}>Miesiąc rozliczenia</button>
  </div>
  <div class="hint">Miesiąc rozliczenia wyznacza data ostatniego dnia terminu, ponieważ rozliczenie zamyka się po realizacji.</div>

  <table>
    <tr><th>Dofinansowanie</th><th>${S.rozlGrup==='uczestnicy'?'Szkolenie':'Uczestnik'}</th><th>Termin</th><th class="num">Kwota przypisana</th><th class="num">Prowizja</th><th>Status</th></tr>
    ${body}
    <tr class="sum"><td colspan="3">Razem</td><td class="num">${zl(sumK)}</td><td class="num">${zl(sumP)}</td><td></td></tr>
  </table>

  <h2>Dane do faktury</h2>
  <div class="panel">
    <dl class="kv">
      <dt>Wystawia</dt><dd>${esc(i.nazwa)}</dd>
      <dt>Nabywca</dt><dd>uczestnik lub jego pracodawca, zależnie od formy</dd>
      <dt>Podstawa</dt><dd>usługa szkoleniowa finansowana ze środków publicznych, zwolniona z podatku</dd>
      <dt>Dokumenty</dt><dd>system nie przechowuje faktur, wyłącznie wartości</dd>
    </dl>
    <div class="inline">
      <button onclick="alert('Makieta: wysyłka powiadomienia o fakturze do instytucji')">Wyślij powiadomienie o fakturze</button>
      <button onclick="alert('Makieta: eksport rozliczenia do pliku Excel')">Eksportuj zestawienie</button>
    </div>
  </div>

  <div class="note"><b>Do rozstrzygnięcia.</b> Sposób rozliczenia, gdy uczestnik nie stawi się na jednym z terminów wchodzących w skład dofinansowania.</div>
  `;
}

/* ================= SZKIELET ================= */

const VIEWS = {
  pulpit:vPulpit, instytucje:vInstytucje, katalog:vKatalog, ustawienia:vUstawienia,
  uczestnicy:vUczestnicy, dofinansowania:vDofinansowania, terminy:vTerminy,
  powiadomienia:vPowiadomienia, statystyki:vStatystyki, rozliczenia:vRozliczenia,
  nabory:vNabory, konta:vKonta, panelucz:vPanelUcz
};

function setInst(id){ S.inst=id; S.szk=S.ucz=S.dof=S.term=null; if(el('ctxInst')) el('ctxInst').value=id; render(); }
window.setInst = setInst;

function renderMenu(){
  let h = '';
  menuDef().forEach(m=>{
    if(m.grp){ h += `<div class="grp">${m.grp}</div>`; return; }
    h += `<a class="item ${S.view===m.id?'on':''}" href="#" onclick="go('${m.id}');return false;">
      <div class="nm">${m.nm}</div><div class="ds">${m.ds}</div></a>`;
  });
  el('menu').innerHTML = h;
}

function render(){
  const allow = menuDef().filter(m=>m.id).map(m=>m.id);
  if(!allow.includes(S.view)) S.view = allow[0];
  el('ctxInstWrap').style.display = (S.rola==='ucz') ? 'none' : 'flex';
  el('ctxInst').disabled = (S.rola==='inst');
  renderMenu();
  el('view').innerHTML = VIEWS[S.view]();
}

el('ctxInst').innerHTML = INST.map(i=>`<option value="${i.id}">${i.nazwa}</option>`).join('');
el('ctxInst').value = S.inst;
el('ctxInst').addEventListener('change', e=>{ S.inst=e.target.value; S.ucz=S.dof=S.term=S.szk=null; render(); });
el('rola').addEventListener('change', e=>{
  S.rola = e.target.value;
  S.ucz=S.dof=S.term=S.szk=null;
  S.filtrTyp=S.filtrStatus='';
  if(S.rola==='inst') S.inst='INS-01';
  render();
});
render();
</script>
