<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System KFS - LDIT - makieta v2</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/style-sesja.css">
<style>
  .role-hint {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    background: var(--brand-900); color: #cbd5e1;
    border-radius: var(--radius); padding: 10px 13px;
    font-size: 12px; max-width: 320px; box-shadow: var(--shadow-lg);
    line-height: 1.5; display: none;
  }
  .role-hint.show { display: block; }
  .role-hint b { color: #fff; }
  .role-hint .x { float: right; cursor: pointer; color: #64748b; margin-left: 10px; }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">LD</div>
      <div>
        <div class="name">System KFS</div>
        <div class="sub">LDIT &middot; makieta v2</div>
      </div>
    </div>

    <div class="sidebar-scroll" id="nav"></div>

    <div class="sidebar-foot" id="stopka">
      Makieta poglądowa &middot; dane demonstracyjne
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"><b>Dashboard</b></div>

      <div class="global-search">
        <span class="si">&#128269;</span>
        <input type="text" placeholder="Szukaj: NIP, nazwa klienta, urząd pracy..." id="gsearch">
      </div>

      <div class="topbar-right">
        <div class="uzytkownik">
          <div class="uzytkownik-dane">
            <div class="uzytkownik-imie" id="imie">&nbsp;</div>
            <div class="uzytkownik-rola" id="rola">&nbsp;</div>
          </div>
          <div class="avatar" id="avatar">&nbsp;</div>
          <button class="btn sm wyloguj" id="wyloguj"
                  data-tip="Konczy sesje i wraca na ekran logowania. Rola wynika z konta, nie z ustawienia w interfejsie. D-125. Sesja wygasa po 30 minutach bezczynnosci, wtedy trzeba zalogowac sie ponownie.">Wyloguj</button>
        </div>
      </div>
    </div>

    <div class="frame-wrap">
      <iframe id="view" src="about:blank"></iframe>
    </div>
  </div>
</div>

<div class="role-hint" id="hint">
  <span class="x" onclick="document.getElementById('hint').classList.remove('show')">&times;</span>
  <span id="hintText"></span>
</div>

<!-- kfs:skrypty -->
<script src="db/sql-wasm.js"></script>
<script src="db/sql-wasm-data.js"></script>
<script src="db/seed-db.js"></script>
<script src="assets/sqlite.js"></script>
<script src="assets/store.js"></script>
<script src="assets/haslo.js"></script>
<script src="assets/funkcje.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/walidacja.js"></script>
<script src="assets/straznik.js"></script>
<script src="assets/zakres.js"></script>
<script src="assets/prowizja.js"></script>
<script src="assets/db.js"></script>
<script src="assets/html.js"></script>
<script src="assets/tips.js"></script>
<script src="assets/boot.js"></script>

<script type="text/kfs-strona">
/* ================================================================
   Powloka makiety.

   Menu nie jest lista zaszyta w kodzie. Buduje sie z tabel role, moduly
   i uprawnienia (D-36), a lista instytucji pod "Dofinansowaniami" z przydzialu
   konta (D-112, D-113). Zmiana uprawnien w module Ustawienia zmienia menu,
   bo oba czytaja to samo zrodlo.
   ================================================================ */

var TIPY_MODULOW = {
  dash: "Statystyki i wskazniki, bez rozpiski klientow. Dwa warianty: administratora (z zyskami i prowizjami) oraz pracownika (bez finansow firmy). D-114, D-30.",
  dofin: "Glowne miejsce pracy. Rozwija liste instytucji. W srodku dwie tabele: Baza danych (wszyscy klienci, klient = jeden wiersz) i Wnioski (projekty od etapu 3), z podzialem na lata. D-127, D-128, D-129.",
  nabory: "Nabory PUP: aktualne, prognozowane i zakonczone (340 urzedow). System jest odbiorca prognoz, nie liczy ich sam. D-109.",
  zadania: "Plan dnia: zadania reczne i automatyczne (przypiete do wniosku i statusu), alerty na date, licznik wnioskow do akceptacji. Modul wrocil do zakresu po warsztacie 04.09. D-140.",
  inst: "Karty instytucji, katalog szkolen, dane do faktur, siedziba (zrodlo miejscowosci na certyfikacie). Jeden klient moze byc u wielu instytucji. D-42, D-99, D-144.",
  komun: "Wysylka maili z biblioteki szablonow, z potwierdzeniem przed wyslaniem (ochrona przed przypadkowym kliknieciem). D-106.",
  admin: "Prowizje szczegolowe (podstawa fakturowania), dashboard prowizji miesieczny i narastajaco, lista i import faktur, statystyki per instytucja i zbiorczo. Tylko administrator. D-138, D-139, D-141.",
  zglo: "Wewnetrzna baza incydentow krytycznych (oszustwo, zanizanie prowizji). Autor domyslnie zalogowany. Tylko admin i pracownicy LDIT. D-107, D-121.",
  ustaw: "Konta i role (konfigurator uprawnien per zakladka), przypisanie pracownikow do instytucji, progi dofinansowania konfigurowalne, rejestr aktywnosci. Tylko administrator. D-36, D-131.",
  panelIS: "Panel instytucji szkoleniowej: wylacznie wlasni klienci. Instytucja nie widzi swojej stawki prowizji. D-76.",
  terminy: "Kalendarz per instytucja: instytucja wystawia terminy i przypisuje je do wniosku, po kliknieciu widac liste uczestnikow. D-142.",
  panelKL: "Panel klienta koncowego, wylacznie odczyt wlasnego wniosku i szkolen. Status modulu otwarty. P-33."
};

var OPIS_ROLI = {
  admin: "<b>Administrator.</b> Widzi wszystkie instytucje, dane finansowe, konfigurator prowizji i rejestry. To jedyna rola z dostępem do stawek prowizyjnych <span class='ref'>D-07</span>",
  pracownik: "<b>Pracownik LDIT.</b> Widzi tylko instytucje przypisane do konta <span class='ref'>D-113</span>. Bez Administracji i Ustawień, bez zysków firmy i stawek prowizji <span class='ref'>D-34</span> <span class='ref'>D-114</span>",
  is: "<b>Instytucja szkoleniowa.</b> Wyłącznie własni klienci <span class='ref'>D-76</span>. Nie widzi swojej stawki prowizji.",
  pracownikIS: "<b>Pracownik IS (handlowiec).</b> Tylko dane klientów, bez kwot i bez numerów PESEL. Rola kończy się na wypełnieniu formularza <span class='ref'>D-75</span>",
  klient: "<b>Klient końcowy.</b> Status OTWARTY, moduł nierozstrzygnięty <span class='ref p'>P-33</span>. Tylko odczyt własnego wniosku."
};

var sesja = Auth.sesja();
var stan = { aktywny: null };

function instytucjeKonta() {
  return DB.INSTYTUCJE.map(function (i) { return i.nazwa; });
}

function render() {
  var moduly = Auth.moduly();
  var html = "";
  var poprzedniaGrupa = null;

  moduly.forEach(function (m) {
    if (m.grupa !== poprzedniaGrupa) {
      html += '<div class="nav-group-label">' + esc(m.grupa) + '</div>';
      poprzedniaGrupa = m.grupa;
    }

    var etykieta = m.nazwa;
    /* Instytucja widzi zakladke opisana nazwa wlasnej spolki (D-76) */
    if (m.id === "panelIS" && sesja.instytucja_nazwa) etykieta = sesja.instytucja_nazwa;

    var rozwijane = m.id === "dofin" && !sesja.instytucja_id;
    var klasy = "nav-item" + (stan.aktywny === m.id ? " active" : "") +
                (m.poziom === "podglad" ? " tylko-podglad" : "");

    html += '<div class="' + klasy + '" data-id="' + esc(m.id) + '" data-plik="' + esc(m.plik) + '"' +
            ' data-label="' + esc(etykieta) + '" data-tip="' + esc(TIPY_MODULOW[m.id] || "") + '">' +
            '<span class="ico">' + (m.ikona || "") + '</span><span>' + esc(etykieta) + '</span>' +
            (rozwijane ? '<span class="chev">&#9654;</span>' : '') + '</div>';

    if (rozwijane) {
      html += '<div class="nav-sub" id="sub-dofin">';
      html += '<div class="nav-item sub-is" data-plik="02-zestawienia.html" data-label="Wszystkie instytucje"' +
              ' data-tip="Zbiorczy widok wszystkich instytucji w zasiegu konta. Osobna, jawna pozycja, zeby nie trzeba bylo sie domyslac. D-127.">' +
              '<span>Wszystkie instytucje</span></div>';
      instytucjeKonta().forEach(function (nazwa) {
        html += '<div class="nav-item sub-is" data-plik="02-zestawienia.html?is=' + encodeURIComponent(nazwa) + '"' +
                ' data-label="' + esc(nazwa) + '"' +
                ' data-tip="Tylko klienci i wnioski instytucji ' + esc(nazwa) + ' (separacja danych, D-35).">' +
                '<span>' + esc(nazwa) + '</span></div>';
      });
      html += '</div>';
    }
  });

  var nav = document.getElementById("nav");
  nav.innerHTML = html;

  nav.querySelectorAll(".nav-item").forEach(function (el) {
    el.addEventListener("click", function (e) {
      e.stopPropagation();

      var id = el.getAttribute("data-id");
      if (id === "dofin") {
        var sub = document.getElementById("sub-dofin");
        if (sub) {
          var otwarte = sub.classList.toggle("open");
          el.classList.toggle("open", otwarte);
          if (otwarte) return;
        }
      }

      var plik = el.getAttribute("data-plik");
      if (!plik) return;

      nav.querySelectorAll(".nav-item").forEach(function (x) { x.classList.remove("active"); });
      el.classList.add("active");
      if (id) stan.aktywny = id;

      ustawOkruszek(el.getAttribute("data-label") || el.textContent.trim());
      document.getElementById("view").src = "strony/" + plik;
    });
  });
}

/* Okruszek buduje sie przez textContent: nazwy pochodza z bazy */
function ustawOkruszek(tekst) {
  var b = document.createElement("b");
  b.textContent = tekst;
  var el = document.getElementById("crumb");
  el.innerHTML = "";
  el.appendChild(b);
}

function pokazSesje() {
  document.getElementById("imie").textContent = sesja.imie;
  document.getElementById("rola").textContent =
    sesja.rola_nazwa + (sesja.instytucja_nazwa ? " · " + sesja.instytucja_nazwa : "");
  document.getElementById("avatar").textContent = Auth.inicjaly();

  /* Konto z ograniczonym zakresem nie dowiaduje sie, ile instytucji jest w systemie */
  var widoczne = DB.INSTYTUCJE.length;
  document.getElementById("stopka").innerHTML =
    "Zakres konta: " + (sesja.wszystkie_instytucje ? "wszystkie instytucje" : "instytucje: " + widoczne) +
    "<br>Dane demonstracyjne, baza SQLite";

  document.getElementById("hintText").innerHTML = OPIS_ROLI[sesja.rola_id] || "";
  document.getElementById("hint").classList.add("show");
}

document.getElementById("wyloguj").addEventListener("click", function () {
  Auth.wyloguj();
  location.replace("login.html");
});

document.getElementById("gsearch").addEventListener("keydown", function (e) {
  if (e.key === "Enter" && this.value.trim()) {
    document.getElementById("view").src = "strony/04-baza-klientow.html?q=" + encodeURIComponent(this.value.trim());
    ustawOkruszek("Wyniki wyszukiwania");
  }
});

/* Ekran startowy: pierwszy modul dostepny dla roli */
var start = Auth.moduly()[0];
if (start) {
  stan.aktywny = start.id;
  ustawOkruszek(start.nazwa);
  document.getElementById("view").src = "strony/" + start.plik;
}

render();
pokazSesje();
</script>

</body>
</html>
