<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Karta klienta</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/style-sesja.css">
<link rel="stylesheet" href="../assets/style-listy.css">
</head>
<body>
<div class="page" id="stronaKlienta">

  <div class="page-head">
    <div class="naglowek-karty">
      <button class="btn sm" id="btnWstecz" data-tip="Wraca do poprzedniego ekranu z tym samym filtrem.">&larr; Wstecz</button>
      <h1 class="page-title" id="tytul">Klient</h1>
      <span class="tip-mark" data-tip="Karta klienta: dane firmy wspólne dla wszystkich jej wniosków (D-54), wszystkie wnioski ze wszystkich lat (D-128) i korespondencja klienta (D-52). Klik w wniosek otwiera jego kartę. Kontakt, wielkość i liczba zatrudnionych mogą się różnić na poszczególnych wnioskach (D-132, D-169).">i</span>
    </div>
    <div class="ph-actions">
      <a class="btn sm" id="btnEdytuj">Edytuj dane</a>
    </div>
  </div>

  <div class="grid g-1-2">
    <div class="card">
      <div class="card-head"><h3>Dane klienta</h3></div>
      <div class="card-body"><dl class="dl" id="dane"></dl></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Wnioski</h3><span class="sub" id="subWnioski"></span></div>
      <div class="lista-tabela" style="--nad-tabela:260px">
        <table class="tbl">
          <thead><tr>
            <th>Wniosek</th><th>Rok</th><th>Instytucja</th><th>Szkolenie</th>
            <th class="num">Przyznano</th><th>Status</th><th>Rozl.</th><th>Etap</th>
          </tr></thead>
          <tbody id="wnioski"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="card-head"><h3>Notatki</h3><span class="sub">ustalenia z rozmów, widoczne w zakresie konta</span></div>
    <div class="card-body">
      <div id="notatkaForm" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px">
        <textarea class="inp" id="nowaNotatka" rows="2" style="flex:1 1 auto" placeholder="Nowa notatka, np. ustalenia z rozmowy"></textarea>
        <button class="btn primary sm" id="btnNotatka">Dodaj notatkę</button>
      </div>
      <div id="notatki"></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="card-head"><h3>Korespondencja</h3><span class="sub">wszystkie maile klienta (D-52)</span></div>
    <div class="card-body tight">
      <table class="tbl">
        <thead><tr><th style="width:30px"></th><th>Temat</th><th>Skrzynka</th><th>Data</th><th class="c">Załączniki</th></tr></thead>
        <tbody id="maile"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- kfs:skrypty -->
<script src="../db/sql-wasm.js"></script>
<script src="../db/sql-wasm-data.js"></script>
<script src="../db/seed-db.js"></script>
<script src="../assets/sqlite.js"></script>
<script src="../assets/store.js"></script>
<script src="../assets/haslo.js"></script>
<script src="../assets/funkcje.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/walidacja.js"></script>
<script src="../assets/straznik.js"></script>
<script src="../assets/zakres.js"></script>
<script src="../assets/prowizja.js"></script>
<script src="../assets/db.js"></script>
<script src="../assets/lata.js"></script>
<script src="../assets/html.js"></script>
<script src="../assets/statusy.js"></script>
<script src="../assets/akceptacje.js"></script>
<script src="../assets/wielowybor.js"></script>
<script src="../assets/nawigacja.js"></script>
<script src="../assets/tips.js"></script>
<script src="../assets/boot.js" data-modul="dofin"></script>
<script src="js/19-klient.js"></script>

inicjuj19();
</script>
</body>
</html>
