<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../assets/style-sesja.css">
<link rel="stylesheet" href="../assets/style-listy.css">
</head>
<body>
<div class="page lista">

  <div class="page-head">
    <h1 class="page-title">Dofinansowania</h1>
    <span class="tip-mark" data-tip="Główne miejsce pracy. Układ z Excela, rok wybierasz w lewym menu jak arkusz (D-159), kolory statusów identyczne z Excelem (D-01, D-158), numeracja klientów ciągła w ramach roku, trafia na fakturę (D-112). Status zmieniasz w komórce (D-115), klik w wiersz otwiera kartę wniosku. Otwarte P-08: zbiorcza tabela jest widokiem operacyjnym, dashboard czysto statystyczny.">i</span>
    <div class="ph-actions">
      <button class="btn sm">Eksport</button>
      <button class="btn primary sm" id="btnNowyProjekt">+ Nowy projekt</button>
    </div>
  </div>

  <nav class="mod-tabs">
    <a href="04-baza-klientow.html" id="zakladkaBaza" data-tip="Baza danych: klienci, jeden klient = jeden wiersz, rozwijany plusem do wniosków. Domyślnie klienci przed złożeniem wniosku. Licznik to tyle klientów, ile pokaże Baza po kliknięciu (filtr instytucji i urzędu przechodzi dalej). D-128, D-130.">Baza danych <span class="n" id="licznikBazy"></span></a>
    <a href="02-zestawienia.html" class="on" data-tip="Wnioski od etapu 3. Licznik to liczba wierszy widocznych teraz: wybrany rok i bieżące filtry. D-128.">Wnioski <span class="n" id="licznikWnioskow"></span></a>
    <a href="13-terminy.html" data-tip="Kalendarz terminów szkoleń per instytucja. D-142.">Terminy szkoleń</a>
  </nav>

  <div class="card">
    <div id="dodajRok" style="display:none;padding:8px 12px 0"></div>
    <div class="toolbar">
      <input class="inp search" id="q" placeholder="Szukaj: NIP, klient, urząd...">
      <select class="inp" id="fIS" data-wielo><option value="">Wszystkie instytucje</option></select>
      <select class="inp" id="fPUP" data-wielo><option value="">Wszystkie urzędy</option></select>
      <select class="inp" id="fStatus" data-wielo><option value="">Wszystkie statusy</option></select>
      <div class="chipy" id="chipyWykresu"></div>
      <span class="sp"></span>
      <span class="small muted" id="licz"></span>
    </div>

    <div class="toolbar" style="background:#fff;border-bottom:1px solid var(--line);padding-top:4px;padding-bottom:4px">
      <span class="small muted"><b>Zaznaczone:</b> <span id="zazn">0</span></span>
      <button class="btn xs" onclick="masowo('Pozytywna')">Oznacz pozytywne</button>
      <button class="btn xs" onclick="masowo('Negatywna')">Oznacz negatywne</button>
      <span class="sp"></span>
      <div class="legend">
        <span><i style="background:var(--st-czekamy-bg);border-color:var(--line-strong)"></i>czekamy</span>
        <span><i style="background:var(--st-poz-bg);border-color:var(--st-poz-mark)"></i>pozytywna</span>
        <span><i style="background:var(--st-neg-bg);border-color:var(--st-neg-mark)"></i>negatywna</span>
        <span><i style="background:var(--st-rez-bg);border-color:var(--st-rez-mark)"></i>rezygnacja</span>
        <span><i style="background:var(--st-set-bg);border-color:var(--st-set-mark)"></i>rozliczony</span>
      </div>
    </div>

    <div id="projForm" class="card-body" style="display:none;border-bottom:1px solid var(--line)"></div>

    <div class="card-body" id="notaRok" style="display:none;border-bottom:1px solid var(--line);padding:8px 12px">
      <div class="note mb0" id="notaRokTresc"></div>
    </div>

    <div class="lista-tabela">
      <table class="tbl" id="tab">
        <thead>
          <tr>
            <th style="width:28px"><input type="checkbox" id="all"></th>
            <th style="width:36px">Nr<span class="tip-mark" data-tip="Numer klienta jest ciągły w ramach roku i trafia na fakturę (D-112).">i</span></th>
            <th>Klient</th>
            <th class="kol-is">Instytucja</th>
            <th>Szkolenie</th>
            <th>Urząd</th>
            <th class="c">Osób<span class="tip-mark" data-tip="Zakwalifikowani; po ukośniku wszyscy zgłoszeni. Do wyliczeń wchodzą tylko zakwalifikowani (D-79).">i</span></th>
            <th class="num">Przyznano<span class="tip-mark" data-tip="Dofinansowanie z urzędu: koszt całkowity × procent progu (D-131).">i</span></th>
            <th class="num">Koszt całk.<span class="tip-mark" data-tip="Wartość uznana przez urząd, z dopłatą staje się podstawą prowizji (D-64).">i</span></th>
            <th>Status</th>
            <th>Rozl.<span class="tip-mark" data-tip="Etap finansowy: Oczekuje, Zafakturowany, Rozliczone.">i</span></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>

</div>
