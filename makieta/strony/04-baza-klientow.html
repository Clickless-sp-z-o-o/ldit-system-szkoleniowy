<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Baza danych</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/style-sesja.css">
<link rel="stylesheet" href="../assets/style-listy.css">
<style>
  /* Wiersze klientow bez naboru wygaszone */
  tr.dim td { color: var(--ink-3); }
  /* Rozwiniete wnioski klienta */
  td.exp-cell { text-align:center; }
  .exp-btn { width:22px; height:22px; padding:0; font-weight:700; line-height:1; }
  tr.wn-detail > td { background: var(--surface-2); padding: 0 0 0 36px; }
  tr.wn-detail table.tbl { margin: 6px 24px 8px 0; background:#fff; border:1px solid var(--line); border-radius:var(--radius); }
  tr.wn-detail table.tbl th { background: var(--surface-3); position: static; }
  /* Podsumowanie naborow w jednej linii, kazda liczba ustawia filtr */
  .podsum { display:flex; gap:14px; align-items:center; font-size:12.5px; color:var(--ink-2); }
  .podsum a { color:inherit; text-decoration:none; }
  .podsum a b { font-size:14px; }
  .podsum a:hover b { color: var(--accent); }
</style>
</head>
<body>
<div class="page lista">

  <div class="page-head">
    <h1 class="page-title">Baza danych</h1>
    <span class="tip-mark" data-tip="Wszyscy klienci końcowi, jeden klient to jeden wiersz, klienta nigdy nie usuwamy (D-128). Domyślnie widać klientów przed złożeniem wniosku (Niezłożony, NW albo bez wniosku), filtr można zdjąć. Rozwiń klienta plusem, żeby zobaczyć jego wnioski, klik w wniosek otwiera kartę wniosku, klik w nazwę kartę klienta. Priorytet kontaktu: ostatni dzień naboru, sortowanie rosnąco (D-130). Data wpłynięcia formularza rejestrowana automatycznie (D-94). W Excelu zakładka nazywała się Niezłożone. Handlowiec IS tego widoku nie widzi (D-91).">i</span>
    <div class="podsum" id="kpi"></div>
    <div class="ph-actions">
      <button class="btn sm">Eksport</button>
      <button class="btn primary sm" id="btnNowyKlient">+ Nowy klient</button>
    </div>
  </div>

  <nav class="mod-tabs">
    <a href="04-baza-klientow.html" class="on" data-tip="Baza danych: klienci, klient = jeden wiersz, rozwijany plusem do wniosków. Licznik to klienci widoczni teraz, przy bieżących filtrach. D-128.">Baza danych <span class="n" id="licznikBazy"></span></a>
    <a href="02-zestawienia.html" id="zakladkaWnioski" data-tip="Wnioski od etapu 3, kolorowane statusem. D-128. Licznik to liczba wierszy, które zobaczysz po kliknięciu: bieżący rok i te same filtry instytucji i urzędu.">Wnioski <span class="n" id="licznikWnioskow"></span></a>
    <a href="13-terminy.html" data-tip="Kalendarz terminów szkoleń per instytucja. D-142.">Terminy szkoleń</a>
  </nav>

  <div class="card" style="padding:0">
    <div class="toolbar">
      <input class="inp search" id="q" placeholder="Szukaj: NIP, klient, urząd...">
      <select class="inp" id="fIS" data-wielo><option value="">Wszystkie instytucje</option></select>
      <select class="inp" id="fPUP" data-wielo><option value="">Wszystkie urzędy</option></select>
      <select class="inp" id="fNab" data-wielo>
        <option value="">Nabór: dowolny</option>
        <option>Nabór ogłoszony</option>
        <option>W trakcie kontaktu</option>
        <option>Brak naboru</option>
        <option>Po naborze</option>
      </select>
      <select class="inp" id="fStatusWn" data-wielo data-tip="Filtr po statusie wniosków klienta, można zaznaczyć kilka. Domyślnie klienci przed złożeniem wniosku: bez wniosku albo z wnioskiem Niezłożony lub NW. Wyczyść wybór, żeby zobaczyć wszystkich klientów.">
        <option value="">Wszyscy klienci</option>
        <option value="przed" selected>Przed złożeniem wniosku</option>
        <option value="aktywne">Z wnioskiem aktywnym (bez rozliczonych)</option>
        <option value="Czekamy">Wniosek: czekamy na decyzję</option>
        <option value="Pozytywna">Wniosek: pozytywna</option>
        <option value="Negatywna">Wniosek: negatywna</option>
        <option value="Rezygnacja">Wniosek: rezygnacja</option>
        <option value="Rozliczone">Wniosek: rozliczony</option>
      </select>
      <span class="sp"></span>
      <div class="legend">
        <span><i style="background:var(--pos-bg);border-color:#86efac"></i>nabór trwa</span>
        <span><i style="background:var(--warn-bg);border-color:#fcd34d"></i>prognoza</span>
      </div>
      <span class="small muted" id="licz"></span>
    </div>

    <div id="klientForm" class="card-body" style="display:none;border-bottom:1px solid var(--line)"></div>

    <div class="lista-tabela">
      <table class="tbl">
        <thead>
          <tr>
            <th style="width:28px"></th>
            <th style="width:36px">Nr<span class="tip-mark" data-tip="Numer klienta nadawany kolejno. Kolejność listy wyznacza koniec naboru, nie numer.">i</span></th>
            <th>Klient</th>
            <th>Wielk.<span class="tip-mark" data-tip="Wielkość przedsiębiorstwa decyduje o progu dofinansowania (D-131). Mikro to do 9 osób na umowie o pracę.">i</span></th>
            <th>Instytucja</th>
            <th>Urząd</th>
            <th>Nabór<span class="tip-mark" data-tip="Stan naboru w urzędzie klienta (D-90).">i</span></th>
            <th class="nowrap">Koniec naboru<span class="tip-mark" data-tip="Ostatni dzień naboru i ile dni zostało. Wyznacza priorytet, lista sortowana rosnąco (D-130). Do 3 dni czerwony, do 10 żółty.">i</span></th>
            <th class="c">Kolejny<span class="tip-mark" data-tip="Czy klient jest zainteresowany kolejnym naborem (D-130).">i</span></th>
            <th class="c">Wnioski</th>
            <th>Kontakt</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="../assets/akceptacje.js"></script>

</body>
</html>
